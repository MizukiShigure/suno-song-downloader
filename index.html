<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Suno 单曲下载</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="screen.css">
  <script type="module" src="page.js"></script>
</head>
<body>
  <main>
    <header><img src="icons/icon128.png" width="52" height="52" alt=""><h1>Suno 单曲下载</h1></header>
    <section class="card" aria-label="解析并保存歌曲">
      <form id="lookup">
        <label for="link">歌曲链接或 ID</label>
        <div class="entry">
          <input id="link" type="text" placeholder="粘贴 Suno 歌曲链接或分享短链" autocomplete="off" spellcheck="false" required>
          <button type="submit" id="resolve">解析歌曲</button>
        </div>
        <p class="note">点击解析会将歌曲 ID 发送给 ai-suno.com。</p>
      </form>
      <div id="result" hidden>
        <div class="song"><h2 id="title"></h2><p id="detail"></p></div>
        <fieldset>
          <legend>保存格式</legend>
          <div class="formats">
            <label><input type="radio" name="format" value="m4a" checked><span><strong>M4A</strong><small>原始文件</small></span></label>
            <label><input type="radio" name="format" value="mp3"><span><strong>MP3</strong><small>192 kbps</small></span></label>
            <label><input type="radio" name="format" value="wav"><span><strong>WAV</strong><small>16-bit PCM</small></span></label>
          </div>
        </fieldset>
        <button type="button" id="save">保存 M4A</button>
        <p class="note" id="format-note">直接保存解析服务提供的 M4A。</p>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
